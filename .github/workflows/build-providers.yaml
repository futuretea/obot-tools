name: Build release providers

permissions:
  id-token: write
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  providers-build:
    runs-on: ubuntu-latest
    concurrency:
      group: oss-providers-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          target: providers
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ github.ref_type == 'tag' && format('ghcr.io/futuretea/obot-tools/providers:{0}', github.ref_name) || 'ghcr.io/futuretea/obot-tools/providers:latest' }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"

      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ github.ref_type == 'tag' && format('ghcr.io/futuretea/obot-tools/providers:{0}', github.ref_name) || 'ghcr.io/futuretea/obot-tools/providers:latest' }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
